# GitHub Dark
name = "GitHub Dark"

[ui]
background = "#0d1117"
foreground = "#c9d1d9"
muted = "#8b949e"
line_numbers = "#484f58"
selection = "#264f78"
cursor_line = "#161b22"
focus = "#58a6ff"
edit = "#3fb950"
error = "#f85149"
warning = "#d29922"
info = "#58a6ff"
success = "#3fb950"
status_bg = "#161b22"
status_fg = "#c9d1d9"
border = "#30363d"
float_bg = "#161b22"
match_bg = "#264f78"
mode_visual = "#bc8cff"
mode_search = "#d29922"

[syntax]
comment = "#8b949e"
keyword = "#ff7b72"
operator = "#ff7b72"
string = "#a5d6ff"
"string.escape" = "#79c0ff"
"string.regexp" = "#a5d6ff"
number = "#79c0ff"
boolean = "#79c0ff"
constant = "#79c0ff"
"constant.builtin" = "#79c0ff"
"variable.builtin" = "#ffa657"
property = "#79c0ff"
function = "#d2a8ff"
"function.call" = "#d2a8ff"
"function.builtin" = "#79c0ff"
constructor = "#ffa657"
type = "#ffa657"
"type.builtin" = "#ffa657"
module = "#ffa657"
decorator = "#d2a8ff"
tag = "#7ee787"
attribute = "#79c0ff"
"markup.heading" = { fg = "#79c0ff", bold = true }
"markup.strong" = { bold = true }
"markup.emphasis" = { italic = true }
"markup.raw" = "#a5d6ff"
"markup.link" = { fg = "#a5d6ff", underline = true }
"markup.list" = "#ff7b72"
"markup.quote" = "#8b949e"
invalid = "#ffa198"
