# Tokyo Night (night), after folke/tokyonight.nvim
name = "Tokyo Night"

[ui]
background = "#1a1b26"
foreground = "#c0caf5"
muted = "#565f89"
line_numbers = "#3b4261"
selection = "#283457"
cursor_line = "#292e42"
focus = "#7aa2f7"
edit = "#9ece6a"
error = "#f7768e"
warning = "#e0af68"
info = "#7dcfff"
success = "#9ece6a"
status_bg = "#16161e"
status_fg = "#a9b1d6"
border = "#27a1b9"
float_bg = "#16161e"
match_bg = "#283457"
mode_visual = "#bb9af7"
mode_search = "#ff9e64"

[syntax]
comment = { fg = "#565f89", italic = true }
keyword = { fg = "#bb9af7", italic = true }
"keyword.control" = "#bb9af7"
"keyword.import" = "#7dcfff"
"keyword.function" = "#bb9af7"
"keyword.operator" = "#bb9af7"
operator = "#89ddff"
string = "#9ece6a"
"string.escape" = "#bb9af7"
"string.regexp" = "#b4f9f8"
number = "#ff9e64"
boolean = "#ff9e64"
constant = "#ff9e64"
"constant.builtin" = "#ff9e64"
variable = "#c0caf5"
"variable.builtin" = "#f7768e"
parameter = "#e0af68"
property = "#73daca"
function = "#7aa2f7"
"function.call" = "#7aa2f7"
"function.builtin" = "#2ac3de"
method = "#7aa2f7"
constructor = "#bb9af7"
type = "#2ac3de"
"type.builtin" = "#2ac3de"
module = "#7dcfff"
decorator = "#7dcfff"
punctuation = "#89ddff"
"punctuation.bracket" = "#a9b1d6"
"punctuation.special" = "#89ddff"
tag = "#f7768e"
attribute = "#bb9af7"
"markup.heading" = { fg = "#7aa2f7", bold = true }
"markup.strong" = { bold = true }
"markup.emphasis" = { italic = true }
"markup.raw" = "#73daca"
"markup.link" = { fg = "#7dcfff", underline = true }
"markup.list" = "#89ddff"
"markup.quote" = "#565f89"
invalid = "#f7768e"
