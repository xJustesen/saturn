[package]
name = "saturn"
version = "0.1.1"
edition = "2024"
description = "Blazingly fast keyboard-first TUI Jupyter notebook"
license = "MIT"

[[bin]]
name = "saturn"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
jupyter-zmq-client = { version = "1", features = ["tokio-runtime"] }
jupyter-protocol = "2"
nbformat = "3"
edtui = { version = "0.11", features = ["syntax-highlighting"] }
two-face = "0.5.2"
tui-markdown = "0.3"
ansi-to-tui = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time", "io-util"] }
futures = "0.3"
nucleo-matcher = "0.3"
ignore = "0.4.34"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
blake3 = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
libc = "0.2"
open = "5"
regex = "1"
arboard = { version = "3", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
